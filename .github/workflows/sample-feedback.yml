name: Sample feedback (advisory)

# Reusable workflow that student repos call on push. It grades ONLY the public
# sample tests that live in the student's own repo (hwN/schema.sql +
# hwN/sample/expected_*.csv for SQL assignments; hwN/sample/expected.json and the
# hwN/*_checks.py engine for Python ones, HW6 on), so there is no secret to protect
# and tampering is harmless. It publishes the result as an advisory Release on the student repo.
# THIS IS NOT THE OFFICIAL GRADE — that is computed by the private grader repo.

on:
  workflow_call:
    inputs:
      assignment:
        type: string
        required: true

permissions:
  contents: write        # to publish the advisory Release on the caller repo

jobs:
  feedback:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Must match the PostgreSQL version students install (Setup step 2 specifies 18).
        # information_schema.check_constraints.check_clause is parenthesized differently
        # in 16 and 18, and HW2 q1/q2 compare that string, so a mismatch here makes a
        # correct answer pass check.py locally and fail the official grade.
        image: postgres:18
        env:
          POSTGRES_USER: grader
          POSTGRES_PASSWORD: grader
          POSTGRES_DB: gradingdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grader"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: grader
      PGPASSWORD: grader
      PGDATABASE: gradingdb
    steps:
      - name: Check out student repo (caller)
        uses: actions/checkout@v5
        with:
          path: submission

      - name: Check out public grader script
        uses: actions/checkout@v5
        with:
          repository: CPSC-285-FALL26/cpsc285-autograde    # <-- this public repo
          path: runner

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install psycopg (Python assignments)
        if: hashFiles(format('submission/{0}/sample/expected.json', inputs.assignment)) != ''
        run: pip install "psycopg[binary]"

      - name: Install psql 18 client
        # The runner's default postgresql-client is 16; pull 18 from PGDG so the
        # client matches the server above and the students' own machines.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          psql --version

      - name: Reshape public sample into grader layout
        run: |
          HW="${{ inputs.assignment }}"
          mkdir -p "tests/$HW/expected"
          cp "submission/$HW/schema.sql" "tests/$HW/setup.sql"
          if [ -f "submission/$HW/sample/expected.json" ]; then
            # Python assignment (HW6 on): one JSON of sample answers, the *_checks.py
            # engine from the student's folder, and a points.json "python" block that
            # tells grade.py which file is the student's module. No points are shown.
            python3 - "$HW" <<'PY'
          import json, re, shutil, sys
          from pathlib import Path
          hw = sys.argv[1]
          sub, tests = Path("submission") / hw, Path("tests") / hw
          engines = sorted(sub.glob("*_checks.py"))
          modules = [f for f in sorted(sub.glob("*.py"))
                     if not f.name.endswith("_checks.py") and not f.name.startswith("check")]
          if len(engines) != 1 or len(modules) != 1:
              print(f"::error::{hw}/ should hold one *_checks.py and one module to test; "
                    f"found {[f.name for f in engines]} and {[f.name for f in modules]}")
              sys.exit(1)
          shutil.copy(engines[0], tests / engines[0].name)
          shutil.copy(sub / "sample" / "expected.json", tests / "expected.json")
          names = sorted(json.loads((tests / "expected.json").read_text()),
                         key=lambda n: int(re.sub(r"\D", "", n) or 0))
          (tests / "points.json").write_text(json.dumps({"python": {
              "checks": engines[0].name, "module": modules[0].name,
              "expected": "expected.json", "names": names}}))
          print(f"Python checks: {engines[0].name} on {modules[0].name}, {', '.join(names)}")
          PY
          else
            for f in submission/$HW/sample/expected_*.csv; do
              base="$(basename "$f" .csv)"; q="${base#expected_}"
              cp "$f" "tests/$HW/expected/$q.csv"
            done
          fi

      - name: Run sample autograder
        run: python3 runner/grade.py --assignment "${{ inputs.assignment }}" --submission submission --tests tests --no-points

      - name: Publish advisory feedback (questions passed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # grade.py writes sample-feedback.md: the pass count, the per-question
        # list, and for each failure the rows that were expected but not
        # returned and vice versa. Passing it with --notes-file rather than
        # building the body in bash keeps the student's own query output (which
        # contains commas, quotes and backticks) out of shell interpolation.
        run: |
          read passed total <<< "$(python3 -c "import json;c=json.load(open('grade-result.json'))['checks'];print(sum(1 for x in c if x['status']=='PASS'), len(c))" 2>/dev/null || echo '0 0')"
          result="${passed}/${total} questions passed"
          if [ "$total" != "0" ] && [ "$passed" = "$total" ]; then marker="✅ PASS"; else marker="❌ FAIL"; fi
          if [ ! -s sample-feedback.md ]; then
            printf 'The advisory run did not produce a result (setup error). Check the Actions log.\n' > sample-feedback.md
          fi
          tag="sample-${{ inputs.assignment }}-$(date -u +%Y%m%d%H%M%S)"
          # NOTE: grade-result.json is intentionally NOT attached (it contains points).
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Sample feedback: ${{ inputs.assignment }} — ${marker} (${result})" \
            --notes-file sample-feedback.md

      - name: Fail the run if any sample check did not pass
        # Runs even though the publish step already created the advisory Release,
        # so the ❌ still shows on the Actions run and on the commit while the
        # student keeps their advisory Release. grade.py is informational (always
        # exits 0); THIS is what turns the check red when a sample test fails.
        if: always()
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              checks = json.load(open("grade-result.json"))["checks"]
          except Exception as e:
              print(f"::error::Could not read grade-result.json ({e}); marking run as failed.")
              sys.exit(1)
          failed = [c["name"] for c in checks if c["status"] != "PASS"]
          if failed:
              print("::error::Sample checks did not pass: " + ", ".join(failed) +
                    ". This advisory run is marked failed so the ✗ shows on your commit — "
                    "fix your queries and push again. (Your official grade still comes from Canvas.)")
              # One annotation per failure with the actual difference, so the
              # reason is visible on the run page without opening the Release.
              for c in checks:
                  if c["status"] == "PASS":
                      continue
                  d = c.get("detail") or {}
                  kind = d.get("kind")
                  if kind == "error":
                      why = "the query did not run: " + d.get("message", "").splitlines()[0]
                  elif kind == "missing":
                      why = f"no file at {d.get('path','')}"
                  elif kind == "python":
                      why = (d.get("message", "").strip().splitlines() or ["did not pass"])[0]
                  elif kind == "order":
                      why = (f"right rows, wrong order (differs from row "
                             f"{d.get('first_diff_index', 0) + 1}) — check the ORDER BY")
                  else:
                      why = (f"returned {d.get('got_rows', 0)} rows, expected "
                             f"{d.get('expected_rows', 0)}; {d.get('missing_total', 0)} missing, "
                             f"{d.get('extra_total', 0)} unexpected")
                  print(f"::error title={c['name']} {c['status']}::{c['name']}: {why}")
              print("Full row-by-row detail is in the job summary and in the advisory Release.")
              sys.exit(1)
          print("All sample checks passed ✔")
          PY
